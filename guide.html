<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Guide Is Almost Ready | Shadow Pre-MD</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F7F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Holding page. Replace the links to this file with the PDF once it exists. */
  :root{ --bg:#F4F7F9; --card:#FFFFFF; --ink:#14232B; --ink-soft:#465A65; --primary:#0F4C5C; --primary-dk:#0A2B35; --accent:#A8401C; --line:rgba(20,35,43,0.16); }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); padding: 32px 20px;
    font-family:'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  main{
    max-width: 560px; background:var(--card); border:1px solid var(--line);
    border-top:4px solid var(--accent); border-radius:14px; padding: 40px 36px 36px;
  }
  .eyebrow{ display:block; font-weight:700; font-size:0.74rem; letter-spacing:0.13em; text-transform:uppercase; color:var(--primary); margin:0 0 8px; }
  h1{ font-family:'Newsreader', Georgia, serif; font-weight:600; font-size:clamp(1.8rem,5vw,2.3rem); line-height:1.12; letter-spacing:-0.012em; margin:0 0 0.35em; }
  p{ margin:0 0 1em; color:var(--ink-soft); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:48px; margin-top: 10px;
    background:var(--primary); color:#FFFFFF; text-decoration:none; font-weight:700; font-size:0.96rem;
    padding:12px 26px; border-radius:999px;
  }
  .btn:hover{ background:var(--primary-dk); }
  a:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  @media (max-width: 520px){ main{ padding: 30px 24px 28px; } .btn{ width:100%; } }
</style>
</head>
<body>
<main>
  <span class="eyebrow">Shadow Pre-MD</span>
  <h1>The guide is almost ready</h1>
  <p>Zoha is finishing the free shadowing guide now. It will be available to download from this page as soon as it is done.</p>
  <p>Until then, the survey results and the research behind the guide are on the main page.</p>
  <a class="btn" href="survey.html">See what physicians said</a>
</main>
</body>
</html>
